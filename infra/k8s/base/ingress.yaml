apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skyscope-ws
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
spec:
  ingressClassName: nginx
  rules:
    - host: ws.skyscope.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: skyscope-ws
                port:
                  name: http-ws
