apiVersion: v1
kind: ConfigMap
metadata:
  name: skyscope-ws-config
data:
  NODE_ENV: production
  PORT: "8000"
  HEARTBEAT_INTERVAL_MS: "15000"
  PRESENCE_LEASE_MS: "45000"
  CLEANUP_INTERVAL_MS: "5000"
  DRAIN_DEADLINE_MS: "20000"
  WS_MAX_PAYLOAD_BYTES: "65536"
  WS_MAX_BUFFERED_BYTES: "1048576"
  CHAT_STREAM_MAX_LENGTH: "10000"
  CHAT_REPLAY_LIMIT: "500"
  DEDUP_TTL_MS: "600000"
  WS_SYNC_BUFFER_MAX_EVENTS: "1000"
